name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job writes state into the workspace, never into the runner's home,
  # so nothing leaks between jobs and nothing needs cleaning up.
  AGENTIC_DATA_DIR: ${{ github.workspace }}/.ci-data

jobs:
  # Fast feedback: the checks that fail most often, on one platform.
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A plain install. `--omit=optional` looks tempting here because this
      # app's native modules are optional — but it also strips rollup's
      # platform binary, which Vite and Vitest need, so the whole toolchain
      # dies. npm not failing when node-pty cannot build is what "optional"
      # already buys us.
      - run: npm ci --no-audit --no-fund

      # Workspaces import each other through their build output, so the
      # dependencies have to exist before anything can be typechecked:
      # server and web import @agentic/core, and desktop imports
      # @agentic/server for its startServer entry point.
      - run: npm run build -w @agentic/core
      - run: npm run build -w @agentic/server

      - run: npm run typecheck
      - run: npx eslint .
      - run: npx prettier --check "**/*.{ts,tsx,json,css}"
      - run: npx vitest run --coverage

      # The app must build and run without its optional native modules —
      # terminals fall back to a piped shell, the vault to an encrypted file.
      # Removing just those two proves it, without taking the toolchain's own
      # platform binaries with it.
      - name: Optional native modules stay optional
        run: |
          rm -rf node_modules/node-pty node_modules/@napi-rs
          npm run typecheck -w @agentic/server

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Proves the whole thing compiles and bundles on every target platform —
      # the Electron main bundle in particular, which is where a Node-only API
      # slipping into the renderer would first show up.
      - run: npm run build
      - run: npm run build -w @agentic/desktop

      - name: Confirm the renderer bundle exists
        shell: bash
        run: test -f web/dist/index.html && test -f desktop/dist/main.cjs

      # "Open a folder" is the first thing anyone does, and when it breaks it
      # breaks SILENTLY: the window still loads, `window.agentic` is simply
      # undefined, and the button does nothing with no error anywhere a user
      # would look. These boot a real Electron window and drive the real
      # handlers, because nothing short of that catches it.
      - name: The desktop bridge and folder picker actually work
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Electron needs a display, and the runner has none.
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb

            # Chromium's SUID sandbox helper ships without root ownership, so
            # Electron refuses to start. `--no-sandbox` is the usual shortcut
            # and is wrong here: it also disables PRELOAD sandboxing, which is
            # the exact condition the bug these checks exist for only appears
            # under. Fixing the helper keeps the check honest.
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

            xvfb-run -a npm run check:preload -w @agentic/desktop
            xvfb-run -a npm run check:open-folder -w @agentic/desktop
          else
            npm run check:preload -w @agentic/desktop
            npm run check:open-folder -w @agentic/desktop
          fi


  e2e:
    name: End-to-end smoke
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @agentic/core

      - run: npx playwright install chromium --with-deps

      # No provider is configured here on purpose: the suite must pass on a
      # machine with no keys and no CLI agents, which is also the state a new
      # user is in on first launch.
      - run: npx playwright test

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
